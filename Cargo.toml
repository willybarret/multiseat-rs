[package]
name = "multiseat-rs"
version = "0.10.0"
edition = "2024"
authors = ["Willian Barreto"]
description = "A blazingly fast, seamless multiseat manager for Linux, written in Rust."
license = "GPL-3.0"
repository = "https://github.com/willybarret/multiseat-rs"
readme = "README.md"
keywords = ["multiseat", "linux", "systemd", "slint"]
categories = ["gui", "os::linux-apis"]
exclude = ["patches/*", "images/*"]

[dependencies]
logind-zbus = "5.3.2"
zbus = "5.18.0"
evdev = "0.13.2"
udev = "0.9.3"
slint = "1.17.1"
convert_case = "0.11.0"

[build-dependencies]
slint-build = "1.17.1"
